[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [".venv", "data", "evaluation_results"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
exclude = "(^\\.venv/|^data/|^evaluation_results/)"
